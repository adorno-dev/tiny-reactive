<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Reactive - Console CRUD</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

<!DOCTYPE html>
<body>
    <div class="container">
        <header>
            <h1>game consoles</h1>
            <p>crud with rust + wasm</p>
        </header>
        
        <main>
            <div class="actions">
                <button id="btn-new" class="btn primary">+ new console</button>
            </div>
            
            <div class="stats-bar">
                <span>total: <span id="total-consoles">0</span></span>
                <span>status: <span id="system-status" class="status-badge">ready</span></span>
            </div>
            
            <table class="consoles-table">
                <thead>
                    <tr>
                        <th>id</th>
                        <th>name</th>
                        <th>manufacturer</th>
                        <th>year</th>
                        <th>cpu</th>
                        <th>gpu</th>
                        <th>units sold (M)</th>
                        <th>actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="8" class="empty-message">no consoles found. click "new console" to add one.</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
    
    <!-- Modal for create/edit -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title">new console</h2>
            <form id="console-form">
                <input type="hidden" id="console-id">
                
                <div class="form-group">
                    <label for="name">name</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label for="manufacturer">manufacturer</label>
                    <input type="text" id="manufacturer" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="year">year</label>
                        <input type="number" id="year" min="1970" max="2024" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="units-sold">units sold (millions)</label>
                        <input type="number" id="units-sold" min="0" step="0.1">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="cpu">cpu</label>
                    <input type="text" id="cpu" required>
                </div>
                
                <div class="form-group">
                    <label for="gpu">gpu</label>
                    <input type="text" id="gpu" required>
                </div>
                
                <div class="form-actions">
                    <button type="button" id="btn-cancel" class="btn">cancel</button>
                    <button type="submit" id="btn-save" class="btn primary">save</button>
                </div>
            </form>
        </div>
    </div>
    
    <script type="module" src="/dist/index.js"></script>
</body>
</html>
